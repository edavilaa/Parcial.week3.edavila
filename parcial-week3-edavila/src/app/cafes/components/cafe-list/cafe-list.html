
<div class="container mt-2">
  <h2 class="titulo-cafe">El aroma mágico</h2>

  <hr>
  <hr>

  <div class="banner-cafe mb-4"></div>

  <table class="table tabla-cafes">
    <thead class="table-dark">
      <tr>
        <th scope="col">#</th>
        <th scope="col">Nombre</th>
        <th scope="col">Tipo</th>
        <th scope="col">Región</th>
      </tr>
    </thead>
    <tbody>
      @for (cafe of cafes; track cafe.id) {
        <tr>
          <th scope="row">{{ cafe.id }}</th>
          <td>{{ cafe.nombre }}</td>
          <td>{{ cafe.tipo }}</td>
          <td>{{ cafe.region }}</td>
        </tr>
      }
    </tbody>
  </table>

  <p class="totales-cafe">
    Total café de origen: {{ totalOrigen }}<br>
    Total café blend: {{ totalBlend }}
  </p>
</div>
